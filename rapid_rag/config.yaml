title: School Rules QA System
version: 1.0.0

LLM_API:
  Ollama:
    host: http://localhost:11434
    model: qwen2.5:7b
  ERNIEBot:
    api_type: aistudio
    access_token: your_token
  Qwen7B_Chat:
    api_url: your_api
  ChatGLM2_6B:
    api_url: your_api
  BaiChuan7B:
    api_url: your_api
  InternLM_7B:
    api_url: your_api

DEFAULT_PROMPT: |
  You are a school rules assistant.
  Answer the user's question strictly based on the uploaded school policy documents.
  If the answer is not clearly supported by the documents, reply with "No clear supporting rule was found in the uploaded documents."

  User question:
  $query

  Retrieved context:
  $context

default_handbook: 2025年本科生学生手册.pdf
materials_dir: materials
upload_dir: data/uploads
vector_db_path: data/vector_db/school_rules.db
record_path: vector_db_data/handbook_chunks.json
settings_path: data/settings/app_config.json

encoder_batch_size: 16
Encoder:
  ERNIEBot:
    api_type: aistudio
    access_token: your_token
  m3e-small:
    model_path: assets/models/m3e-small
    device: auto

SENTENCE_SIZE: 200
top_k: 5

Parameter:
  max_length:
    min_value: 0
    max_value: 4096
    default: 1024
    step: 1
    tip: Maximum generated token length.
  top_p:
    min_value: 0.0
    max_value: 1.0
    default: 0.7
    step: 0.01
    tip: Controls nucleus sampling during text generation.
  temperature:
    min_value: 0.01
    max_value: 1.0
    default: 0.01
    step: 0.01
    tip: Controls generation randomness.
